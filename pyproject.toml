[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "nexus"
version     = "0.1.0"
description = "Production-grade Personalized Marketplace Intelligence Platform"
readme      = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",

    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "psycopg2-binary>=2.9.0",

    # Streaming
    "confluent-kafka>=2.3.0",
    "faust-streaming>=0.10.0",

    # Feature Store
    "redis[hiredis]>=5.0.0",
    "msgpack>=1.0.0",

    # ML / Training
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "sentence-transformers>=2.6.0",
    "faiss-cpu>=1.8.0",

    # MLOps
    "mlflow>=2.11.0",
    "ray[default]>=2.9.0",
    "dagster>=1.6.0",
    "dagster-webserver>=1.6.0",

    # Data quality
    "great-expectations>=0.18.0",

    # Observability
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",

    # Utilities
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "faker>=24.0.0",
    "factory-boy>=3.3.0",
    "hypothesis>=6.99.0",
]

graph = [
    "torch-geometric>=2.5.0",
    "networkx>=3.2.0",
]

forecasting = [
    "darts>=0.28.0",
    "statsmodels>=0.14.0",
    "pymc>=5.10.0",
]

[project.scripts]
nexus-simulate = "services.data_simulator.main:app"
nexus-serve    = "services.serving.gateway.main:app"
nexus-features = "services.feature_store.pipeline.main:app"

[tool.ruff]
line-length    = 100
target-version = "py311"
select         = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore         = ["E501", "B008"]

[tool.ruff.isort]
known-first-party = ["nexus", "services", "shared", "sdk"]

[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests", "services"]
addopts      = "-v --cov=services --cov=shared --cov-report=term-missing"
